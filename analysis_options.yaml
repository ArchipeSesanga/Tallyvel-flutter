include: package:very_good_analysis/analysis_options.yaml

# riverpod_lint is an analyzer plugin. `dart analyze` runs it; `flutter analyze` does not.
plugins:
  riverpod_lint: ^3.2.0

linter:
  rules:
    # Pushes the brand-new `const new(...)` constructor shorthand. Off until
    # that syntax is settled across the team and the tooling.
    unnecessary_type_name_in_constructor: false

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - '**/*.g.dart'
    - '**/*.freezed.dart'
