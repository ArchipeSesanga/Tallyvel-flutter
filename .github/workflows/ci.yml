name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      # Before codegen, so only hand-written code is checked.
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      # Generated files (*.g.dart, *.freezed.dart) are not committed.
      - name: Generate code
        run: dart run build_runner build --delete-conflicting-outputs

      # `dart analyze`, not `flutter analyze`: only dart analyze runs analyzer
      # plugins, and riverpod_lint is one.
      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Test
        run: flutter test
